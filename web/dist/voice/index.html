<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>白总 · 车上聊</title><link rel="stylesheet" href="/voice/style.css"></head><body><main><h1>白总 · 车上聊</h1><p class="note">停车时设置；手机连接车载蓝牙，保持此页前台亮屏。iOS 需前台亮屏；播报时不收音，不支持语音打断（barge-in）。锁屏和后台通话不可靠。</p><p id="login" hidden>请先<a href="/" target="_top">使用网站用户名密码登录</a>，再打开白总语音。无需额外语音口令。</p><section id="controls" hidden><div class="buttons"><button id="start">开始聊天</button><button id="stop">停止</button><button id="replay">重播回答</button><button id="logout">退出登录</button></div><label><input id="auto" type="checkbox" checked> 回答后自动继续听</label><p id="support"></p><form id="textForm"><label for="text">文字后备 / 手机键盘听写</label><textarea id="text" rows="3" maxlength="4000" placeholder="说不了时，在这里输入或使用键盘麦克风"></textarea><button id="send">发送</button></form><div id="history" aria-label="对话记录"></div></section><p id="status" role="status" aria-live="polite">正在验证网站登录状态…</p><p class="note">浏览器识别可能使用 Apple / 浏览器厂商的语音服务；识别结果发送给当前白总。蓝牙播放和麦克风路由由手机决定。</p></main><script src="/voice/app.js" defer></script></body></html>
